name: Manual CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  POETRY_VERSION: "1.8.3"
jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: snok/install-poetry@v1
        with:
          version: '${{ env.POETRY_VERSION }}'
      - run: poetry --version
      - run: poetry install --no-root --only dev
      - run: poetry run pre-commit run -a
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: snok/install-poetry@v1
        with:
          version: '${{ env.POETRY_VERSION }}'
      - run: poetry install
      - run: poetry run pytest -q --disable-warnings --maxfail=1 --cov=portfolio --cov-report=term-missing --cov-fail-under=60
