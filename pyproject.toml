[tool.poetry]
name = "gammaedge"
version = "0.1.0"
description = "Portfolio optimization, risk analytics, and backtesting platform"
authors = ["Tu Nombre <tu@email.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "app" }, { include = "portfolio" }]

# ──────────────────────────────────────────────────────────────────────────────
# DEPENDENCIAS PRINCIPALES
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.dependencies]
python = "^3.11"

# Core numérico / tabular
numpy = ">=1.26,<2.0"
scipy = ">=1.11"
polars = ">=1.4.0"
pyarrow = ">=16.0.0"

# Interoperabilidad y modelos estadísticos
pandas = ">=2.2.2"
scikit-learn = ">=1.4.2"
statsmodels = ">=0.14.2"

# Finanzas e IO
yfinance = ">=0.2.40"
requests = ">=2.32.0"

# Visualización / UI
plotly = ">=5.22.0"
streamlit = ">=1.36.0"

# API
fastapi = ">=0.112.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }

# Config
pyyaml = ">=6.0.1"

# ── DEPENDENCIAS OPCIONALES (para extras) ─────────────────────────────────────
# OJO: aquí se ponen con version + optional=true. Luego se referencian por nombre en [tool.poetry.extras]
arch = { version = ">=6.3.0", optional = true }
cvxpy = { version = ">=1.4.3", optional = true }
torch = { version = "*", optional = true }
jupyterlab = { version = ">=4.2.0", optional = true }
ipykernel = { version = ">=6.29.0", optional = true }

# ──────────────────────────────────────────────────────────────────────────────
# GRUPOS OPCIONALES (dev/docs)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = ">=5.0.0"
hypothesis = ">=6.103.0"
ruff = ">=0.5.0"
black = ">=24.4.2"
mypy = ">=1.10.0"
types-requests = ">=2.32.0.20240712"
types-PyYAML = ">=6.0.12.20240808"
pre-commit = ">=3.7.0"
nbstripout = ">=0.7.1"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.26"
mkdocstrings = { version = ">=0.24.0", extras = ["python"] }

# ──────────────────────────────────────────────────────────────────────────────
# EXTRAS (solo nombres, SIN versiones)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.extras]
ml = ["torch"]                 # scikit-learn ya está en core
garch = ["arch"]
opt = ["cvxpy"]
notebooks = ["jupyterlab", "ipykernel"]

# ──────────────────────────────────────────────────────────────────────────────
# ENTRY POINTS (opcional)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.scripts]
gammaedge-api = "api.main:run"
gammaedge-app = "app.Home:main"

# ──────────────────────────────────────────────────────────────────────────────
# LINTER/FORMATTER/TYPECHECKER
# ──────────────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I", "N", "E", "F", "UP", "SIM", "B", "C90"]
ignore = ["E203", "E266", "E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = "(^tests/|^notebooks/)"

# ──────────────────────────────────────────────────────────────────────────────
# PYTEST CONFIG
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-q --tb=short"

# ──────────────────────────────────────────────────────────────────────────────
# BUILD-SYSTEM
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
