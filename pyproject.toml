[tool.poetry]
name = "gammaedge"
version = "2.1.0-dev"
description = "Portfolio optimization, risk analytics, and backtesting platform"
authors = ["Tu Nombre <tu@email.com>"]
readme = "README.md"
license = "MIT"

# Publicamos SOLO el core del paquete (portfolio). La app/ tests/ etc. quedan fuera del wheel.
packages = [{ include = "portfolio" }]
exclude = [
  "app*",
  "tests*",
  "notebooks*",
  "docs*",
  ".github*",
  "scripts*",
  "tools*",
  "data*"
]

# ── DEPENDENCIAS PRINCIPALES ───────────────────────────────────────────────────
[tool.poetry.dependencies]
python = ">=3.11,<3.12"                          # Estabilizamos en 3.11 para CI y local
numpy = ">=1.26,<2.0"
scipy = ">=1.11"
polars = ">=1.4.0"
pyarrow = ">=16.0.0"
pandas = ">=2.2.2"
scikit-learn = ">=1.4.2"
statsmodels = ">=0.14.2"
yfinance = ">=0.2.40"
requests = ">=2.32.0"
plotly = { extras = ["kaleido"], version = "^6.3.1" }
streamlit = ">=1.36.0"
fastapi = ">=0.112.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pyyaml = ">=6.0.1"
reportlab = "^4.4.4"
openpyxl = ">=3.1.0"
typing-extensions = ">=4.6"                      # Necesario en py310; no molesta en 3.11

# ── TIER 1 ENHANCEMENTS ────────────────────────────────────────────────────────
hmmlearn = ">=0.3.0"                              # HMM regime detection
xgboost = ">=2.0.0"                               # Gradient boosting predictors
pandas-datareader = ">=0.10.0"                    # Fama-French data fetching
shap = ">=0.45.0"                                 # XGBoost interpretability

# ── EXTRAS OPCIONALES ──────────────────────────────────────────────────────────
arch = { version = ">=6.3.0", optional = true }
cvxpy = { version = ">=1.4.3", optional = true }
torch = { version = "*", optional = true }
jupyterlab = { version = ">=4.2.0", optional = true }
ipykernel = { version = ">=6.29.0", optional = true }
cryptography = "^48.0.0"
xlsxwriter = "^3.2.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = ">=5.0.0"
hypothesis = ">=6.103.0"
ruff = ">=0.5.0"
black = ">=24.4.2"
mypy = ">=1.10.0"
pandas-stubs = "*"
types-requests = ">=2.32.0.20240712"
types-PyYAML = ">=6.0.12.20240808"
types-python-dateutil = "*"
types-setuptools = "*"
pre-commit = ">=3.7.0"
nbstripout = ">=0.7.1"
httpx = "^0.28.1"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.26"
mkdocstrings = { version = ">=0.24.0", extras = ["python"] }

[tool.poetry.extras]
ml = ["torch"]
garch = ["arch"]
opt = ["cvxpy"]
notebooks = ["jupyterlab", "ipykernel"]

# Nota: dejamos los entry points, pero la app no se empaqueta. Invocarlos fallará si no está el código.
# En CI no los ejecutamos, así que no afectan a la build ni a los tests.
[tool.poetry.scripts]
gammaedge-api = "api.main:run"
gammaedge-app = "app.Home:main"
export-report = "tools.export_report:main"

# ── BLACK ──────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── RUFF ───────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "E", "F", "UP", "SIM", "B", "C90"]
ignore = [
  "E203", "E266", "E501",
  "N801", "N802", "N803", "N806",
  "C901",
  "B008",
  "UP007",
  "E701", "E702",
  "UP017",
]

[tool.ruff.format]
quote-style = "preserve"

# ── MYPY ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["portfolio", "api"]
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
  "^tests/.*",
  "^notebooks/.*",
  "^docs/.*",
  "^data/.*",
  "^app/.*",
]

[[tool.mypy.overrides]]
module = ["portfolio.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["api.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# ── PYTEST ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = """
-q --disable-warnings --maxfail=1
--cov=portfolio
--cov-report=term-missing
--cov-fail-under=65
"""
